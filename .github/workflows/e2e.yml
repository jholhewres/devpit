name: E2E

# The built app, driven through a WebDriver under a virtual display.
#
# Not on every push: it builds the release binary and drives a real window for
# a quarter of an hour, and a suite that moves a window carries timing a unit
# test does not. It runs every night on main, when asked, and before every
# release — `release.yml` calls it, and nothing is published unless it passes.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    steps:
      # Pinned like release.yml's: this also runs inside the release.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev \
            webkit2gtk-driver xvfb tmux

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # tauri-driver is a cargo install, and compiling it on every run is two
      # minutes spent on a tool that did not change.
      - name: Cache tauri-driver
        id: driver
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-${{ runner.os }}-2
      - name: Install tauri-driver
        if: steps.driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - run: make setup
      - run: make e2e
        env:
          E2E_HEADLESS: '1'

      # Always, and failing runs most of all: the screenshots and the app's own
      # log are how a red run gets read without running it again.
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-shots
          path: |
            target/e2e-shots
            target/e2e-home/app.log
          if-no-files-found: warn
