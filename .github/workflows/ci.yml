name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Tests and a build, nothing published: releasing is `release.yml`, which
# runs on a tag and is the only job that holds the signing key.
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # The desktop shell links against the system webview. Without these the
      # failure is a linker error a long way from its cause.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # The same two commands anyone runs locally. CI repeating them by hand is
      # how CI and the Makefile drift apart.
      - run: make setup
      - run: make test

      # `make test` builds in debug, so a module gated wrong for release
      # compiles there and fails only when someone ships. It did once.
      - run: make build

  # The built app, driven through a WebDriver under a virtual display. Its own
  # job because it takes minutes and needs a display server, and after `test`
  # because a tree that fails the unit tests is not worth photographing.
  visual:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev \
            webkit2gtk-driver xvfb tmux

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # tauri-driver is a cargo install, and compiling it on every run is two
      # minutes spent on a tool that did not change.
      - name: Cache tauri-driver
        id: driver
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-${{ runner.os }}-2
      - name: Install tauri-driver
        if: steps.driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked

      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: make setup
      - run: make e2e
        env:
          E2E_HEADLESS: '1'

      # Always, and failing runs most of all: the screenshots and the app's own
      # log are how a red visual job gets read without rerunning it.
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: |
            target/e2e-shots
            target/e2e-home/app.log
          if-no-files-found: warn
