name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Tests and a build, nothing published: releasing is `release.yml`, which
# runs on a tag and is the only job that holds the signing key. The built app
# driven through a real window is `e2e.yml`: nightly, on request, and before
# every release, not on every push.
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # The desktop shell links against the system webview. Without these the
      # failure is a linker error a long way from its cause.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # The same two commands anyone runs locally. CI repeating them by hand is
      # how CI and the Makefile drift apart.
      - run: make setup
      - run: make test

      # `make test` builds in debug, so a module gated wrong for release
      # compiles there and fails only when someone ships. It did once.
      #
      # A question about the release profile's code, not its optimisation:
      # without LTO and with parallel codegen it is answered minutes sooner.
      # The frontend `make test` just built is used as it is: `tauri build`
      # would otherwise run `beforeBuildCommand` and build it a second time.
      - run: ./node_modules/.bin/tauri build --config '{"build":{"beforeBuildCommand":""}}'
        env:
          CARGO_PROFILE_RELEASE_LTO: 'off'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'

  # Linux is where this is written, and macOS is where it breaks: a method the
  # webview exposes on one platform and not the other compiles here and fails
  # there. Until this job existed, Apple's compiler first saw the code on a
  # tag — which is how v0.1.5 died at `.transparent(true)`, a call that needs
  # `macos-private-api` to exist at all on macOS.
  #
  # `make test-rust` and not a bespoke `cargo check`: the guards and the Rust
  # tests are the bar, and CI does not invent commands nobody can run by hand.
  # The frontend is left to the Linux job, which already builds it once.
  #
  # Windows is absent on purpose. `release.yml` ships Linux and macOS, and a
  # platform nobody releases is a platform nobody should be blocked by.
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: make setup
      - run: make test-rust
