name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No release, publish or deploy job. Those arrive with v1.
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # The desktop shell links against the system webview. Without these the
      # failure is a linker error a long way from its cause.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # The same two commands anyone runs locally. CI repeating them by hand is
      # how CI and the Makefile drift apart.
      - run: make setup
      - run: make test
