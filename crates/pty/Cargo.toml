[package]
name = "devpit-pty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
devpit-core = { path = "../core" }
portable-pty = "0.9.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["sync", "time", "rt"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }

# Only for signalling a process group, and only where groups exist.
# `/usr/bin/kill` takes a negative pid as an option and silently signals
# nothing — see `stopping::signal_group`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
