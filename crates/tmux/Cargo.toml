[package]
name = "devpit-tmux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The environment a server and its windows start with — see `environment.rs`.
devpit-pty = { path = "../pty" }
thiserror = "2.0.20"

[dev-dependencies]
devpit-agentcli = { path = "../agentcli" }
tempfile = "3.27.0"

# The stop-on-close test asks the kernel directly whether a group is there.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
