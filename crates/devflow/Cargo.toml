[package]
name = "devpit-devflow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# A review's reviewers run headless on the person's own agent CLIs.
devpit-agentcli = { path = "../agentcli" }
devpit-core = { path = "../core" }
# A team layer is fetched at a pinned ref and read blob by blob, never checked out.
devpit-git = { path = "../git" }
# A card's checks run as a command step runs, and their verdict is a run's.
devpit-rpc = { path = "../rpc" }
devpit-steps = { path = "../steps" }
serde ={ version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The digest a skill is listed with, as the MCP Skills extension writes it.
sha2 = "0.10"
# The event parser, for the line each key and value sits on: an invalid
# devflow.yaml is answered with its line and field.
yaml-rust2 = { version = "0.13.0", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
