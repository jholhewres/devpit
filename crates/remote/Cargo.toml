[package]
name = "devpit-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# rustls for the relay's wss://, on the same provider and the same platform
# trust store reqwest already uses for devpit.app, so nothing new is trusted.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Noise, the whole of the end-to-end encryption: X25519, ChaCha20-Poly1305
# and BLAKE2s, and nothing devpit wrote itself below the handshake's pattern.
snow = { version = "0.10", default-features = false, features = ["std", "default-resolver", "use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "__rustls-tls"] }

[dev-dependencies]
# What the machine answers a client from outside, for the tests that carry it.
devpit-agentapi = { path = "../agentapi" }
