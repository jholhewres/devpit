[package]
name = "devpit-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
devpit-core = { version = "0.1.0", path = "../../crates/core" }
devpit-git = { version = "0.1.0", path = "../../crates/git" }
devpit-pty = { version = "0.1.0", path = "../../crates/pty" }
devpit-rpc = { version = "0.1.0", path = "../../crates/rpc" }
devpit-tmux = { version = "0.1.0", path = "../../crates/tmux" }
devpit-agentcli = { version = "0.1.0", path = "../../crates/agentcli" }
devpit-steps = { version = "0.1.0", path = "../../crates/steps" }
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri = { version = "2", features = [] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync"] }
ulid = "3.0.0"
base64 = "0.22"
# rustls rather than the system OpenSSL: the bundle has to build the same way
# on every machine that builds it.
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
tauri-plugin-dialog = "2.7.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3.27.0"
# The pty traits answer in `anyhow::Result`, and the ownership tests stand a
# fake in for a pty whose ends the rule never touches.
anyhow = "1.0.104"

# Only for `mkfifo`, and only where a fifo exists. The tap's Windows half is
# the daemon, not this.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
