[package]
name = "quockpit-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
quockpit-core = { version = "0.1.0", path = "../../crates/core" }
quockpit-git = { version = "0.1.0", path = "../../crates/git" }
quockpit-pty = { version = "0.1.0", path = "../../crates/pty" }
quockpit-rpc = { version = "0.1.0", path = "../../crates/rpc" }
quockpit-tmux = { version = "0.1.0", path = "../../crates/tmux" }
quockpit-agentcli = { version = "0.1.0", path = "../../crates/agentcli" }
quockpit-steps = { version = "0.1.0", path = "../../crates/steps" }
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri = { version = "2", features = [] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync"] }
ulid = "3.0.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }
