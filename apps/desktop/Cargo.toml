[package]
name = "devpit-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
devpit-core = { path = "../../crates/core" }
devpit-git = { path = "../../crates/git" }
devpit-pty = { path = "../../crates/pty" }
devpit-rpc = { path = "../../crates/rpc" }
devpit-tmux = { path = "../../crates/tmux" }
devpit-agentcli = { path = "../../crates/agentcli" }
devpit-agentapi = { path = "../../crates/agentapi" }
devpit-cookies = { path = "../../crates/cookies" }
devpit-steps = { path = "../../crates/steps" }
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The downloaded package is checked again before its command is shown.
sha2 = "0.10"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
# `unstable` is on for one thing: `Window::add_child`, which is the only way
# to put a second webview inside this window and is gated behind it
# (tauri-2.11.5, src/window/mod.rs:1127). It is what the browser pane is made
# of.
#
# The cost is named so nobody pays it by accident: an unstable API may change
# between *minor* tauri releases, so raising this version is something to read
# release notes for rather than bump. `xtask/src/packaging.rs` holds the
# tripwire: `TAURI_READ` pins the version whose unstable API this repo has
# read, and the check refuses a lockfile past it.
# `macos-private-api` is what makes a transparent window exist on macOS at
# all: without it `WebviewWindowBuilder::transparent` is not compiled there and
# the build fails on Apple's machine alone. The cost is the App Store, which
# refuses an app that touches private API — devpit ships its own dmg, deb and
# AppImage, so there is nothing to lose. The main window already asked for
# transparency in tauri.conf.json; this is what honours it.
tauri = { version = "2", features = ["unstable", "macos-private-api"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync"] }
ulid = "3.0.0"
base64 = "0.22"
# The hook secret, and nothing else. A ULID is a timestamp and a counter, so a
# secret derived from one is a secret anything that knows when the app started
# can guess.
getrandom = "0.3"
# rustls rather than the system OpenSSL: the bundle has to build the same way
# on every machine that builds it.
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
tauri-plugin-dialog = "2.7.3"
# The 2.x line for tauri 2.11.5; 3.0.0-alpha.0 is the tauri-3 one.
tauri-plugin-updater = "2.11.0"
tauri-plugin-clipboard-manager = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3.27.0"
# The pty traits answer in `anyhow::Result`, and the ownership tests stand a
# fake in for a pty whose ends the rule never touches.
anyhow = "1.0.104"

# Only for `mkfifo`, and only where a fifo exists. The tap's Windows half is
# the daemon, not this.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Placing a browser pane's page, and nothing else. The page is a second webview
# inside this window, and on GTK neither tauri nor wry will put it where it
# belongs — `browser_gtk` reaches for the widget and does it. Pinned to the
# version tauri already resolves so this adds no tree of its own.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
gtk = "0.18"
