[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/rpc",
    "crates/git",
    "crates/pty",
    "crates/tmux",
    "crates/agentcli",
    "crates/steps",
    "apps/desktop",
    "xtask",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/jholhewres/devpit"

[workspace.dependencies]
devpit-core = { path = "crates/core" }
devpit-rpc = { path = "crates/rpc" }
devpit-git = { path = "crates/git" }
devpit-pty = { path = "crates/pty" }
devpit-tmux = { path = "crates/tmux" }
devpit-agentcli = { path = "crates/agentcli" }
devpit-steps = { path = "crates/steps" }

# The binary stays open all day with several fronts live. Size and startup are
# not vanity here — and now measured: against `opt-level = 3`, "s" is 9.81 MB
# to 13.63 MB, and the time to the webview differs by less than the spread of
# three runs. See .omc/evidence/17/opt-level.md.
[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"

# The shell rebuilds on every screen change in dev; without this the webview
# wait dominates the cycle.
[profile.dev.package."*"]
opt-level = 2
