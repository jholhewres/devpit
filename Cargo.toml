[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/rpc",
    "crates/git",
    "crates/pty",
    "crates/tmux",
    "crates/agentcli",
    "crates/steps",
    "apps/desktop",
    "xtask",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/jholhewres/devpit"

[workspace.dependencies]
devpit-core = { path = "crates/core" }
devpit-rpc = { path = "crates/rpc" }
devpit-git = { path = "crates/git" }
devpit-pty = { path = "crates/pty" }
devpit-tmux = { path = "crates/tmux" }
devpit-agentcli = { path = "crates/agentcli" }
devpit-steps = { path = "crates/steps" }

# The binary stays open all day with several fronts live. Size and startup are
# not vanity here — and now measured: against `opt-level = 3`, "s" is 9.81 MB
# to 13.63 MB, and the time to the webview differs by less than the spread of
# three runs. See .omc/evidence/17/opt-level.md.
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
# Symbols kept, debug info dropped. A panic that reaches somebody else's
# machine comes back as a paste, and `strip = true` turns that paste into
# hexadecimal — which is the same as no report at all.
#
# Measured on this tree rather than argued about, all against a 10,385,592
# byte binary:
#
#   strip = true                 10,385,592   frames not even named
#   strip = "debuginfo"          12,310,288   +18.5%, frames named
#   debug = "line-tables-only"   51,547,088   +396%, named with file and line
#   debug = 1                    63,122,888   +508%, the same plus more
#
# File and line would be better and costs five times the download. Named
# frames are the difference between a backtrace somebody can read and one
# nobody can, and they cost a fifth. Warp keeps `debug = 1` on release and
# pays it; they also ship a crash reporter that symbolicates for them, and we
# do not — a paste in an issue is the whole of what we get.
strip = "debuginfo"

# The shell rebuilds on every screen change in dev; without this the webview
# wait dominates the cycle.
[profile.dev.package."*"]
opt-level = 2

# The two that are measured rather than compiled: a dev build's terminal must
# not be slower than a release one for its own reasons, or the next attempt to
# find out why opening an agent takes thirty seconds will be measuring this
# instead of the thing it is looking for.
[profile.dev.package.devpit-pty]
opt-level = 3
[profile.dev.package.devpit-tmux]
opt-level = 3
